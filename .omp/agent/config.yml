symbolPreset: nerd
theme:
  dark: titanium
  light: light-dunes
setupVersion: 2
defaultThinkingLevel: auto
skills:
  enableClaudeUser: false
  enableClaudeProject: false
modelRoles:
  task: runinfra/glm-5-3-flash:max
  vision: openai-codex/gpt-5.6-terra:max
  advisor: openai-codex/gpt-5.6-luna:medium
  designer: openai-codex/gpt-5.6-terra:xhigh
  tiny: openai-codex/gpt-6-luna:max
  commit: openai-codex/gpt-6-luna:xhigh
  smol: runinfra/glm-5-3-flash:max
  plan: openai-codex/gpt-6.1-sol:xhigh
  memory: openai-codex/gpt-6-luna:max
  default: openai-codex/gpt-6.1-sol:auto
  slow: cursor/grok-4.7:auto
providers:
  anthropic:
    serverSideFallback: false
  openai-codex:
    codeMode: "on"
autolearn:
  enabled: true
dev:
  autoqaConsent: denied
  autoqa: false
memory:
  backend: local
retry:
  fallbackChains:
    default:
      - openai-codex/gpt-6-luna
codexResets:
  autoRedeem: "no"
composer:
  shape: rule
read:
  renderMarkdown: true
astGrep:
  enabled: true
colorBlindMode: false
statusLine:
  separator: powerline-thin
  compactThinkingLevel: false
lsp:
  formatOnWrite: true
  diagnosticsOnEdit: true
browser:
  headless: true
task:
  agentModelOverrides:
    scout: cursor/composer-2.5:high
    sonic: cursor/composer-2.5:medium
compaction:
  handoffSaveToDisk: true
  experimentalContextManagement: false
bashInterceptor:
  enabled: false
shellMinimizer:
  sourceOutlineLevel: default
vault:
  enabled: true
github:
  enabled: true
security:
  enabled: true
find:
  enabled: "off"
plan:
  autosave: true
secrets:
  enabled: true
eval:
  tools:
    enabled: true
prewalk:
  enabled: false
